
name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Lint, test and build
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
